name: aunt-leah-cms

services:
  mongo:
    image: mongo:7
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "mongodb://localhost:27017/admin",
          "--eval",
          "db.adminCommand('ping').ok",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  gotenberg:
    image: gotenberg/gotenberg:8
    ports:
      - "${GOTENBERG_PORT:-3000}:3000"

  api:
    build:
      context: .
    environment:
      ENVIRONMENT: "${ENVIRONMENT:-local}"
      MONGO_URI: mongodb://mongo:27017/auntleah
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      GOTENBERG_URL: http://gotenberg:3000
      OUTPUT_DIR: /outputs
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./pyproject.toml:/app/pyproject.toml
      - outputs_data:/outputs
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      gotenberg:
        condition: service_started
    command:
      ["uvicorn", "backend_app.asgi:app", "--host", "0.0.0.0", "--port", "8000"]

  worker:
    build:
      context: .
    environment:
      MONGO_URI: mongodb://mongo:27017/auntleah
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      GOTENBERG_URL: http://gotenberg:3000
      OUTPUT_DIR: /outputs
    volumes:
      - ./src:/app/src
      - ./pyproject.toml:/app/pyproject.toml
      - outputs_data:/outputs
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
      gotenberg:
        condition: service_started
    command:
      [
        "celery",
        "-A",
        "backend_app.celery_app.celery",
        "worker",
        "--loglevel=INFO",
        "--concurrency=1",
      ]

  seed:
    build:
      context: .
    restart: "no"
    environment:
      - MONGO_URI=mongodb://mongo:27017/auntleah
    volumes:
      - ./src:/app/src
    depends_on:
      mongo:
        condition: service_healthy
    command: ["python", "-m", "backend_app.seed_db"]

  # # this was a pain to setup because official docs sucks until i found this
