# AI Disclosure: Almost entirely generated by Claude Sonnet 4.6 with human tweaks and oversight
name: CI/CD Pipeline

on:
  push:
    branches: [main] # TODO: maybe add a develop branch so we can have better CI workflow?
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
  # FRONTEND
  # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci # ci is better than install here apparently

      - name: Lint
        working-directory: frontend
        run: npm run lint

      # We don't have frontend tests, but this could be useful in the future
      # - name: Run tests
      #   working-directory: frontend
      #   run: npm test -- --watchAll=false

      - name: Build
        working-directory: frontend
        run: npm run build

  # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
  # BACKEND
  # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet mongodb://localhost:27017/admin --eval \"db.adminCommand('ping').ok\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Lint
        working-directory: backend
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        working-directory: backend
        env:
          MONGO_URI: mongodb://localhost:27017/auntleah
          PYTHONPATH: src
        run: pytest -q

      # build and test take too much time, test starts up docker containers

  # ─────────────────────────────────────────
  # DEPLOY (only on push to main)
  # ─────────────────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: "Look through commit history"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # used help with AI (i want make clean only when seed_db changes)
      - name: Detect changes to seed_db.py
        id: file_check
        uses: dorny/paths-filter@v3
        with:
          filters: |
            seed_script:
              - 'backend/**/seed_db.py'

      - name: Deploy backend
        uses: appleboy/ssh-action@v1
        env:
          RESET_DB: ${{ steps.file_check.outputs.seed_script }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: RESET_DB
          script: |
            cd ~/Aunt-Leah-Content-Management-System/backend
            git fetch origin
            git checkout main
            git reset --hard origin/main
            if [ "$RESET_DB" = "true" ]; then
              make clean
            fi
            make up
