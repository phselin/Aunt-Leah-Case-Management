# AI Disclosure: Almost entirely generated by Claude Sonnet 4.6 with human tweaks and oversight
name: CI/CD Pipeline

on:
  push:
    branches: [main] # TODO: maybe add a develop branch so we can have better CI workflow?
  pull_request:
    branches: [main]

jobs:
  # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
  # FRONTEND
  # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci # ci is better than install here apparently

      - name: Lint
        working-directory: frontend
        run: npm run lint

      # We don't have frontend tests, but this could be useful in the future
      # - name: Run tests
      #   working-directory: frontend
      #   run: npm test -- --watchAll=false

  # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
  # BACKEND
  # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Lint
        working-directory: backend
        run: make lint

      - name: Build
        working-directory: backend
        run: make build

      - name: Test
        working-directory: backend
        run: make test

      # Clean up named volumes (because of how build works)
      - name: Clean up
        if: always()
        working-directory: backend
        run: make clean

  # ─────────────────────────────────────────
  # DEPLOY (only on push to main)
  # ─────────────────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: "Look through commit history"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # used help with AI (i want make clean only when seed_db changes)
      - name: Detect changes to seed_db.py
        id: file_check
        uses: dorny/paths-filter@v3
        with:
          filters: |
            seed_script:
              - 'backend/**/seed_db.py'

      - name: Deploy backend
        uses: appleboy/ssh-action@v1
        env:
          RESET_DB: ${{ steps.file_check.outputs.seed_script }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: RESET_DB
          script: |
            cd ~/Aunt-Leah-Content-Management-System/backend
            git pull origin main
            if [ "$RESET_DB" = "true" ]; then
              make clean
            fi
            make up
