name: CI/CD Pipeline

on:
  push:
    branches: [main] # TODO: maybe add a develop branch so we can have better CI workflow?
  pull_request:
    branches: [main]

jobs:
  # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
  # FRONTEND
  # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci   # ci is better than install here apparently

      - name: Lint
        working-directory: frontend
        run: npm run lint

      # We don't have frontend tests, but this could be useful in the future
      # - name: Run tests
      #   working-directory: frontend
      #   run: npm test -- --watchAll=false

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build/
          
  # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
  # BACKEND
  # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
  
      - name: Build
        working-directory: backend
        run: make build
  
      - name: Lint
        working-directory: backend
        run: make lint
  
      - name: Test
        working-directory: backend
        run: make test

      # Clean up named volumes (because of how build works)
      - name: Clean up
        if: always()
        working-directory: backend
        run: make clean

  # ─────────────────────────────────────────
  # DEPLOY (only on push to main)
  # ─────────────────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [frontend, backend]   # both must pass first
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend/build

      - name: Deploy frontend
        run: |
          # TODO: Add frontend deployment
          # Example: deploy to S3, Vercel, Netlify, etc.
          echo "Deploy frontend here"

      - name: Deploy backend
        run: |
          # TODO: Add backend deployment
          # Example: SSH into server, push to Heroku, deploy to AWS Lambda, etc.
          echo "Deploy backend here"
